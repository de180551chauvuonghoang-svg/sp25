        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;

                align-items: center;
                height: 100vh;

            }
            .loading {
                text-align: center;
                color: #007bff;
            }
            .spinner {
                border: 4px solid #f3f3f3;
                border-top: 4px solid #007bff;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 20px;
            }
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>
